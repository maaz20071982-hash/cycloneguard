services:
  # CycloneGuard Backend (FastAPI + SQLite + Model Engine)
  - type: web
    name: cycloneguard-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///cycloneguard.db
      - key: PYTHONPATH
        value: ".:backend"
      - key: CORS_ORIGINS
        value: "https://frontend-two-rho-74.vercel.app,http://localhost:3000"
