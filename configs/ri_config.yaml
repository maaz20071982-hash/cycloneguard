# CycloneGuard — Rapid Intensification (RI) Configuration
# Version: 1.0.0
# Description: Configurable scientific threshold definitions for Tropical Cyclone Rapid Intensification.

ri_definition:
  standard: "WMO_NHC_KAPLAN_DEMARIA_2003"
  justification: >
    World Meteorological Organization (WMO) and National Hurricane Center (NHC) standard
    operational definition established by Kaplan & DeMaria (2003): An increase in maximum
    sustained surface wind speed of at least 30 knots (approx 15.4 m/s or 35 mph) within
    a 24-hour forecast period.

threshold:
  value: 30.0
  unit: "knots"
  forecast_horizon_hours: 24.0
  minimum_initial_intensity_kts: null  # Optional filter (e.g. >= 25 kts)
  
sub_thresholds:
  ri_12h:
    value: 20.0
    unit: "knots"
    forecast_horizon_hours: 12.0
    justification: "Sub-synoptic 12-hour rapid intensification threshold."
  ri_36h:
    value: 45.0
    unit: "knots"
    forecast_horizon_hours: 36.0
    justification: "Extended 36-hour rapid intensification threshold."

target_labels:
  positive_label: 1
  negative_label: 0
  unavailable_label: null
