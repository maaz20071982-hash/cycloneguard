<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; rx: 8px; stroke: #334155; stroke-width: 1px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .axis { stroke: #475569; stroke-width: 1px; }
    .grid { stroke: #334155; stroke-dasharray: 4,4; stroke-width: 1px; }
    .tick-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; }
    .legend-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #e2e8f0; }
  </style>
  <rect width="760" height="440" class="bg"/>
  <text x="35" y="38" class="title">Empirical Probability Calibration & Reliability Assessment</text>
  <text x="35" y="58" class="subtitle">Brier Score and Reliability Curves on Chapala (T vs TS) | Documents Empirical Uncalibrated State</text>
  <line x1="500" y1="38" x2="525" y2="38" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="532" y="42" class="legend-text">Finalist T (Brier=0.1616)</text>
  <line x1="500" y1="56" x2="525" y2="56" stroke="#10b981" stroke-width="2.5"/>
  <text x="532" y="60" class="legend-text">Finalist TS (Brier=0.1626)</text>
  <line x1="120" y1="90" x2="120" y2="370" class="axis"/>
  <line x1="120" y1="370" x2="400" y2="370" class="axis"/>
  <line x1="120" y1="370" x2="400" y2="90" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="390" y="105" font-family="sans-serif" font-size="10px" fill="#64748b">Perfect Reliability</text>
  <line x1="120" y1="370" x2="400" y2="370" class="grid"/>
  <text x="110" y="374" text-anchor="end" class="tick-label">0.0</text>
  <line x1="120" y1="90" x2="120" y2="370" class="grid"/>
  <text x="120" y="388" text-anchor="middle" class="tick-label">0.0</text>
  <line x1="120" y1="314" x2="400" y2="314" class="grid"/>
  <text x="110" y="318" text-anchor="end" class="tick-label">0.2</text>
  <line x1="176" y1="90" x2="176" y2="370" class="grid"/>
  <text x="176" y="388" text-anchor="middle" class="tick-label">0.2</text>
  <line x1="120" y1="258" x2="400" y2="258" class="grid"/>
  <text x="110" y="262" text-anchor="end" class="tick-label">0.4</text>
  <line x1="232" y1="90" x2="232" y2="370" class="grid"/>
  <text x="232" y="388" text-anchor="middle" class="tick-label">0.4</text>
  <line x1="120" y1="202" x2="400" y2="202" class="grid"/>
  <text x="110" y="206" text-anchor="end" class="tick-label">0.6</text>
  <line x1="288" y1="90" x2="288" y2="370" class="grid"/>
  <text x="288" y="388" text-anchor="middle" class="tick-label">0.6</text>
  <line x1="120" y1="146" x2="400" y2="146" class="grid"/>
  <text x="110" y="150" text-anchor="end" class="tick-label">0.8</text>
  <line x1="344" y1="90" x2="344" y2="370" class="grid"/>
  <text x="344" y="388" text-anchor="middle" class="tick-label">0.8</text>
  <line x1="120" y1="90" x2="400" y2="90" class="grid"/>
  <text x="110" y="94" text-anchor="end" class="tick-label">1.0</text>
  <line x1="400" y1="90" x2="400" y2="370" class="grid"/>
  <text x="400" y="388" text-anchor="middle" class="tick-label">1.0</text>
  <text x="260.0" y="406" text-anchor="middle" class="tick-label" font-weight="600">Mean Predicted Probability</text>
  <text x="85" y="230.0" text-anchor="middle" class="tick-label" font-weight="600" transform="rotate(-90 85 230.0)">Fraction of Positives</text>
  <rect x="440" y="90" width="290" height="280" class="card"/>
  <text x="455" y="118" class="title" font-size="14px">Scientific Calibration Status</text>
  <text x="455" y="145" class="subtitle" font-size="11px" fill="#cbd5e1">• Cohort Size: N=53 (Chapala), 10 RI+.</text>
  <text x="455" y="165" class="subtitle" font-size="11px" fill="#cbd5e1">• Validation Set: N=42 (Megh), 6 RI+.</text>
  <text x="455" y="195" class="subtitle" font-size="11px" fill="#cbd5e1">• Finding: Dataset scale remains</text>
  <text x="455" y="210" class="subtitle" font-size="11px" fill="#cbd5e1">  insufficient for reliable isotonic or</text>
  <text x="455" y="225" class="subtitle" font-size="11px" fill="#cbd5e1">  Platt calibration fitting.</text>
  <text x="455" y="255" class="subtitle" font-size="11px" fill="#f59e0b">• Operational Rule: Model outputs</text>
  <text x="455" y="270" class="subtitle" font-size="11px" fill="#f59e0b">  must be presented as empirical risk</text>
  <text x="455" y="285" class="subtitle" font-size="11px" fill="#f59e0b">  indices, not true physical probabilities.</text>
</svg>
