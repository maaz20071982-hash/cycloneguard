  <text x="139.33333333333334" y="85" text-anchor="middle" class="tick-label" font-size="10px">100%</text>
  <text x="123.33333333333334" y="400" text-anchor="middle" class="tick-label" font-weight="600">PHAILIN</text>
  <rect x="201.00000000000003" y="380" width="26" height="0" fill="#38bdf8" rx="3"/>
