  <text x="550.0" y="400" text-anchor="middle" class="tick-label" font-weight="600">MEGH</text>
  <rect x="627.6666666666667" y="281" width="26" height="99" fill="#38bdf8" rx="3"/>
  <text x="640.6666666666667" y="276" text-anchor="middle" class="tick-label" font-size="10px">34%</text>
  <rect x="659.6666666666667" y="261" width="26" height="119" fill="#10b981" rx="3"/>
  <text x="672.6666666666667" y="256" text-anchor="middle" class="tick-label" font-size="10px">41%</text>
